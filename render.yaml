services:
  - type: web
    name: cineplay-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cineplay-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mahitech580.github.io,http://localhost:5500,http://127.0.0.1:5500
      - key: MONGODB_DATABASE
        value: cineplay

databases:
  - name: cineplay-postgres
    plan: free
    region: oregon
    databaseName: cineplay
    user: cineplay
