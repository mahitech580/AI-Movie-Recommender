name: CINEPLAY QA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cineplay
          POSTGRES_USER: cineplay
          POSTGRES_PASSWORD: cineplay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cineplay -d cineplay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://cineplay:cineplay@127.0.0.1:5432/cineplay
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DATABASE: cineplay
      CORS_ORIGINS: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax
        run: python -m compileall -q backend scripts

      - name: Train ML artifact
        run: python scripts/train_model.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Backend full-stack smoke test
        run: PYTHONPATH=. python scripts/smoke_test.py

      - name: JavaScript syntax
        run: node --check assets/app.js


      - name: Install browser test dependency
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static site
        run: python -m http.server 4173 --bind 127.0.0.1 >/tmp/cineplay-http.log 2>&1 &

      - name: Browser UI smoke test
        run: node scripts/browser_smoke.mjs

      - name: Static contract
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/app.js
          test -f data/movies.js
          test -f data/movies.json
          test -f manifest.webmanifest
          test -f assets/cineplay-icon.svg
          test -f .nojekyll
          grep -q "CINEPLAY" index.html
          grep -q "scikit" requirements.txt || true
