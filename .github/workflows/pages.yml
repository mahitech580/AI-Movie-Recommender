name: CINEPLAY QA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax
        run: python -m compileall -q backend scripts

      - name: Train ML artifact
        run: python scripts/train_model.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: node --check assets/app.js

      - name: Static contract
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/app.js
          test -f data/movies.js
          test -f data/movies.json
          test -f manifest.webmanifest
          test -f assets/cineplay-icon.svg
          test -f .nojekyll
          grep -q "CINEPLAY" index.html
          grep -q "scikit" requirements.txt || true
