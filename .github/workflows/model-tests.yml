name: CINEPLAY model and data-pipeline tests

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "scripts/**"
      - "tests/**"
      - "data/movies.json"
      - "requirements.txt"
      - "requirements-eda.txt"
      - "requirements-ai.txt"
      - "requirements-mlops.txt"
      - "requirements-vision.txt"
      - "requirements-deep-learning.txt"
      - ".github/workflows/advanced-models.yml"
      - ".github/workflows/poster-vision.yml"
      - ".github/workflows/deep-learning.yml"
      - "index.html"
      - "assets/app.js"
      - "assets/styles.css"
      - "scripts/browser_smoke.mjs"
      - "render.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/model-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and test dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend scripts tests
      - name: Test data ETL, analytics, and ranking metrics
        run: PYTHONPATH=. pytest -q tests
      - name: Train catalog feature artifact
        run: python scripts/train_model.py
      - name: Check frontend JavaScript syntax
        run: |
          node --check assets/app.js
          node --check scripts/browser_smoke.mjs
          node --check data/movies.js
          node --check data/series.js
